<style>
@page { size: A4; margin: 12mm; }
html, body { background: #fff !important; }
.wrap { max-width: none !important; padding: 0 !important; }
.map-scroll { overflow: visible !important; }
.map-box { width: 100% !important; }
.map { box-shadow: none !important; break-inside: avoid; background: none !important; }
.map-hint, .tabs, .readout, .map-switch { display: none !important; }
.map-pane[hidden] { display: block !important; }
.pane-iso { break-before: page; }
.iso-legend { grid-template-columns: minmax(0, 1fr) !important; }
.num-list { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }
.icon-list { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; }
.print-page { break-before: page; display: grid; gap: 16px; }
.plan { break-inside: avoid; }
.plan svg { min-width: 0 !important; }
.plan img { max-height: 150mm; width: auto !important; max-width: 100%; margin: 0 auto; }
.todo { break-before: page; }
.site { break-before: page; }
.site-grid { display: flex !important; flex-direction: column; }
.site-grid .table-box { order: -1; }
.site-grid .panel { break-before: page; }
.table-box, .panel { break-inside: avoid; }
.area-table { min-width: 0 !important; }
#siteNorth svg { min-width: 0 !important; }
#siteSouth svg { width: auto !important; height: 160mm !important; max-width: 100%; margin: 0 auto; }
.table-box { break-before: auto; }
.strip { break-inside: avoid; }
</style>
<script>
document.documentElement.dataset.theme = "light";
window.addEventListener("load", () => {
  const sec = document.getElementById("detailSec"), frag = document.createDocumentFragment();
  for (const id of PAGES) {
    select(id);
    const p = document.createElement("section"); p.className = "print-page";
    const src = document.getElementById("detail");
    while (src.firstChild) p.appendChild(src.firstChild);
    frag.appendChild(p);
  }
  sec.replaceWith(frag);
  document.querySelectorAll(".zone.on").forEach(z => z.classList.remove("on"));
});
</script>
