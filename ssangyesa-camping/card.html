<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쌍계사 캠핑 인스타 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0c1f1a; --pine:#14352c; --moss:#2c5a45;
    --paper:#f3ead8; --amber:#ffb347; --ember:#ff7a2f; --mist:#9fc3b0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#222;display:flex;justify-content:center}
  .card{
    position:relative;width:1080px;height:1350px;overflow:hidden;
    background:linear-gradient(180deg,#07130f 0%,#0c1f1a 38%,#14352c 100%);
    font-family:'Noto Sans KR',sans-serif;color:var(--paper);
  }
  .stars{position:absolute;inset:0}
  .stars i{position:absolute;border-radius:50%;background:#fff}
  .moon{position:absolute;top:96px;right:110px;width:120px;height:120px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#fff8e1,#f3e2b0 70%);}
  .tag{position:absolute;top:96px;left:90px;font-size:26px;letter-spacing:.32em;color:var(--amber);font-weight:500}
  .tag::after{content:"";display:block;width:64px;height:3px;background:var(--amber);margin-top:16px}
  .title{position:absolute;top:290px;left:90px;right:90px;font-family:'Noto Serif KR',serif;font-weight:900}
  .title .l1,.title .l2{font-size:128px;line-height:1.12;letter-spacing:-.02em}
  .title .l1 em{font-style:normal;color:var(--amber)}
  .title .q{color:var(--ember)}
  .sub{position:absolute;top:640px;left:90px;font-size:34px;line-height:1.7;font-weight:300;color:#d8e6dd}
  .sub b{font-weight:700;color:var(--paper)}
  svg.land{position:absolute;left:0;bottom:0;width:1080px;height:640px}
  .glow{position:absolute;left:720px;top:960px;width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,170,70,.55),transparent 65%)}
  .info{position:absolute;left:70px;right:70px;bottom:56px;padding:26px 44px;border-radius:28px;
    background:rgba(243,234,216,.96);color:#14352c;display:flex;justify-content:space-between;align-items:center}
  .info .k{font-size:20px;letter-spacing:.18em;color:#47594e;font-weight:500;margin-bottom:6px}
  .info .v{font-family:'Noto Serif KR',serif;font-weight:700;font-size:34px}
  .info .div{width:2px;align-self:stretch;background:rgba(20,53,44,.18)}
</style>
</head>
<body>
<div class="card">
  <div class="stars" id="stars"></div>
  <div class="moon"></div>

  <div class="tag">SSANGYESA CAMP</div>

  <div class="title">
    <div class="l1"><em>쌍계사</em>에서</div>
    <div class="l2">캠핑을 한다고<span class="q">?</span></div>
  </div>

  <p class="sub">천년 고찰 <b>쌍계사</b> 숲속에서 맞는<br>고요한 하룻밤, 별과 모닥불, 새벽 풍경 소리.</p>

  <svg class="land" viewBox="0 0 1080 640" preserveAspectRatio="none">
    <path d="M0 250 L140 150 L280 240 L430 110 L600 250 L760 140 L920 230 L1080 160 V640 H0Z" fill="#1c4538"/>
    <path d="M0 340 L180 250 L330 330 L520 220 L700 340 L880 260 L1080 340 V640 H0Z" fill="#14352c"/>
    <g fill="#0a1d17">
      <path d="M0 640 V430 L40 330 L80 430 L50 430 L100 510 L60 510 L110 590 V640Z"/>
      <path d="M130 640 V470 L160 390 L190 470 L170 470 L210 540 L180 540 L220 610 V640Z"/>
      <path d="M1080 640 V400 L1030 300 L980 400 L1010 400 L950 490 L990 490 L930 580 V640Z"/>
      <path d="M900 640 V480 L930 410 L960 480 L940 480 L975 550 L950 550 L985 620 V640Z"/>
      <path d="M0 470 Q540 400 1080 470 V640 H0Z"/>
    </g>
    <g transform="translate(0,-112)">
      <path d="M440 560 L600 395 L760 560Z" fill="#f3ead8"/>
      <path d="M600 395 L760 560 L600 560Z" fill="#d9cdb2"/>
      <path d="M560 560 L600 470 L640 560Z" fill="#ffb347"/>
      <path d="M600 395 V560" stroke="#b9ac8e" stroke-width="3"/>
    </g>
    <g transform="translate(0,-112)"><path d="M840 560 Q820 520 842 488 Q846 520 866 506 Q880 540 862 560Z" fill="#ff7a2f"/>
    <path d="M846 560 Q838 538 850 520 Q858 540 866 560Z" fill="#ffd27a"/></g>
  </svg>
  <div class="glow"></div>

  <div class="info">
    <div><div class="k">DATE</div><div class="v">일정 추후 공지</div></div>
    <div class="div"></div>
    <div><div class="k">PLACE</div><div class="v">경남 하동 · 쌍계사</div></div>
    <div class="div"></div>
    <div><div class="k">INFO</div><div class="v">@your_account</div></div>
  </div>
</div>
<script>
  const s=document.getElementById('stars');let seed=7;
  const r=()=>(seed=(seed*9301+49297)%233280)/233280;
  for(let i=0;i<70;i++){const e=document.createElement('i');
    const z=1+r()*3;
    e.style.cssText=`left:${r()*1080}px;top:${r()*560}px;width:${z}px;height:${z}px;opacity:${.3+r()*.7}`;
    s.appendChild(e)}
</script>
</body>
</html>
