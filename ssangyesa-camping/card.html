<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>쌍계사 캠핑 인스타 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --paper:#ece5d6; --ink:#1d1b17; --muted:#5d574c; --red:#c23a22; --rule:#1d1b17; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#888;display:flex;justify-content:center}
  .card{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Sans KR',sans-serif}
  .grain{position:absolute;inset:0;opacity:.35;mix-blend-mode:multiply;pointer-events:none}

  .frame{position:absolute;inset:56px;border-top:2px solid var(--rule);border-bottom:2px solid var(--rule)}
  .meta{position:absolute;left:0;right:0;top:18px;display:flex;justify-content:space-between;
    font-size:22px;font-weight:500;letter-spacing:.04em}
  .meta span:nth-child(2){color:var(--muted)}

  .head{position:absolute;left:0;top:150px;font-family:'Nanum Myeongjo',serif;font-weight:800;
    letter-spacing:-.045em;line-height:.98}
  .head .a,.head .b,.head .c{font-size:176px}
  .head .b{padding-left:120px}
  .head .q{color:var(--red)}

  .side{position:absolute;right:0;top:170px;writing-mode:vertical-rl;font-family:'Nanum Myeongjo',serif;
    font-size:30px;letter-spacing:.32em;color:var(--muted)}

  .body{position:absolute;left:0;top:780px;width:560px;font-size:28px;line-height:1.75}
  .body p+p{margin-top:18px;color:var(--muted);font-size:24px}

  .seal{position:absolute;right:20px;top:770px;width:200px;height:200px;border:5px solid var(--red);
    color:var(--red);font-family:'Nanum Myeongjo',serif;font-weight:800;font-size:58px;line-height:1.1;
    display:grid;place-items:center;text-align:center;transform:rotate(-4deg);opacity:.9}
  .seal::after{content:"";position:absolute;inset:8px;border:2px solid var(--red)}

  .rows{position:absolute;left:0;right:0;bottom:0}
  .row{display:grid;grid-template-columns:150px 1fr;padding:20px 0;border-top:1px solid rgba(29,27,23,.35);font-size:26px}
  .row .k{font-weight:600;letter-spacing:.06em}
</style>
</head>
<body>
<div class="card">
  <div class="frame">
    <div class="meta"><span>지리산 · 하동 화개면</span><span>TEMPLE CAMP 01</span></div>

    <div class="head">
      <div class="a">쌍계사에서</div>
      <div class="b">캠핑을</div>
      <div class="c">한다고<span class="q">?</span></div>
    </div>

    <div class="side">절 마당에 텐트 하나</div>

    <div class="body">
      <p>해 지면 산문이 닫히고, 남는 건<br>계곡 물소리와 새벽 예불 종소리뿐.</p>
      <p>템플스테이도, 오토캠핑도 아닌<br>그 사이 어딘가의 하룻밤.</p>
    </div>

    <div class="seal">쌍계<br>야영</div>

    <div class="rows">
      <div class="row"><span class="k">일정</span><span class="v">추후 공지</span></div>
      <div class="row"><span class="k">장소</span><span class="v">경남 하동군 화개면 쌍계사</span></div>
      <div class="row"><span class="k">문의</span><span class="v">@your_account · 프로필 링크</span></div>
    </div>
  </div>

  <svg class="grain" width="1080" height="1350"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 .3  0 0 0 0 .27  0 0 0 0 .22  0 0 0 .55 0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
</div>
</body>
</html>
