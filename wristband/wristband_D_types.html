<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>산사캠프 팔찌 D안</title>
<style>
  @font-face { font-family: "BHS"; src: url(assets/BlackHanSans-Regular.ttf); }
  @font-face { font-family: "Jua"; src: url(assets/Jua-Regular.ttf); }
  @font-face { font-family: "Rubik"; src: url(assets/Rubik.ttf); font-weight: 300 900; }
  body { margin: 0; background: #e4e4e1; font-family: "Jua", sans-serif; color: #141414; }
  .sheet { padding: 48px 56px; width: 1524px; }
  h1 { font-family: "BHS"; font-size: 40px; margin: 0 0 4px; font-weight: 400; }
  .spec { font-size: 17px; color: #555; margin-bottom: 36px; }
  .item { margin-bottom: 44px; }
  .label { font-family: "BHS"; font-size: 26px; margin-bottom: 10px; }
  .label small { font-family: "Jua"; font-size: 17px; color: #555; margin-left: 10px; }
  svg.band { display: block; width: 1524px; height: 152.4px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.18)); }
  text { font-family: "Jua"; }
  .bhs { font-family: "BHS"; }
  .num { font-family: "Rubik"; font-weight: 800; }
  .cond { font-family: "Rubik"; font-weight: 900; }
</style>
</head>
<body>
<div class="sheet">
  <h1>山寺캠프 입장팔찌 D안 · 참가 유형별 컬러</h1>
  <div class="spec">254 × 25.4mm · 바탕색 = 참가 유형 (초록 텐트 / 주황 방사 / 하늘 당일) · 일련번호 접두어 T / S / D</div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <pattern id="dotsGreen" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="12" height="12" fill="#2EA85C"/>
        <circle cx="6" cy="6" r="2.6" fill="#1E7A41"/>
      </pattern>
      <pattern id="zig" width="40" height="22" patternUnits="userSpaceOnUse">
        <path d="M0,16 L10,6 L20,16 L30,6 L40,16" fill="none" stroke="#bdbdbd" stroke-width="3"/>
      </pattern>
      <!-- 블롭 레이어 (가운데 영역 180~2360) -->
      <g id="blobs">
        <path d="M180,0 L520,0 C565,55 470,105 515,165 C555,215 650,205 668,254 L180,254 Z"/>
        <path d="M930,0 C1000,70 1110,40 1160,118 C1210,196 1090,226 1128,254 L1500,254 C1458,192 1560,152 1600,92 C1640,32 1585,12 1604,0 Z"/>
        <path d="M1880,0 C1856,72 1966,108 1946,170 C1928,228 1990,254 1990,254 L2360,254 L2360,0 Z"/>
      </g>
      <g id="qr">
        <rect x="0" y="0" width="140" height="140" rx="10" fill="#fff" stroke="#141414" stroke-width="6"/>
        <rect x="16" y="16" width="30" height="30" fill="#141414"/>
        <rect x="94" y="16" width="30" height="30" fill="#141414"/>
        <rect x="16" y="94" width="30" height="30" fill="#141414"/>
        <rect x="94" y="94" width="30" height="30" fill="#141414"/>
        <text x="70" y="78" text-anchor="middle" class="num" font-size="20" fill="#141414">QR</text>
      </g>
      <g id="leftTab">
        <rect x="0" y="0" width="180" height="254" fill="#fff"/>
        <rect x="14" y="14" width="152" height="226" fill="url(#zig)"/>
        <line x1="180" y1="0" x2="180" y2="254" stroke="#141414" stroke-width="6"/>
      </g>
      <g id="rightTab">
        <rect x="2360" y="0" width="180" height="254" fill="#fff"/>
        <line x1="2360" y1="0" x2="2360" y2="254" stroke="#141414" stroke-width="6"/>
      </g>
    <pattern id="dotsTan" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="12" height="12" fill="#DDB28A"/><circle cx="6" cy="6" r="2.2" fill="#C49464"/>
      </pattern>
      <pattern id="dotsYellow" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="12" height="12" fill="#EEE639"/><circle cx="6" cy="6" r="1.8" fill="#D6CC1E"/>
      </pattern>
    </defs>
  </svg>

  
  <!-- ============ D-1 : 텐트 캠핑존 ============ -->
  <div class="item">
    <div class="label">D-1 · 텐트 캠핑존 <small>초록 망점 메인 × 노랑 — 포스터 잔디·의자 색</small></div>
    <svg class="band" id="bandTent" viewBox="0 0 2540 254" xmlns="http://www.w3.org/2000/svg">
      <rect width="2540" height="254" fill="url(#dotsYellow)"/>
      <use href="#blobs" fill="url(#dotsGreen)" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>
      <use href="#leftTab"/>
      <use href="#qr" x="216" y="57"/>
      <image href="assets/logo_black.png" x="392" y="-6" width="860" height="267"/>
      <text x="1300" y="100" class="num" font-size="46" fill="#141414">with</text>
      <g fill="#fff" stroke="#141414" stroke-width="10" paint-order="stroke" stroke-linejoin="round">
        <text x="1292" y="224" class="bhs" font-size="132">쌍계사</text>
      </g>
      <g fill="#fff" stroke="#141414" stroke-width="9" paint-order="stroke" stroke-linejoin="round">
        <text x="1990" y="78" class="bhs" font-size="56">텐트 캠핑</text>
      </g>
      <g fill="#141414">
        <text x="1990" y="128" class="cond" font-size="44" transform="translate(1990 0) scale(.78 1) translate(-1990 0)">2026.11.06 – 11.08</text>
        <text x="1990" y="172" font-size="30">금 14:00 ~ 일 11:00</text>
        <text x="1990" y="226" class="num" font-size="34" letter-spacing="2">T-0001</text>
      </g>
      <use href="#rightTab"/>
      <rect x="0" y="0" width="2540" height="254" fill="none" stroke="#141414" stroke-width="10"/>
    </svg>
  </div>

  <!-- ============ D-2 : 한옥 방사 스테이 ============ -->
  <div class="item">
    <div class="label">D-2 · 한옥 방사 스테이 <small>주황 메인 × 황토 — 단청·흙길 색</small></div>
    <svg class="band" id="bandStay" viewBox="0 0 2540 254" xmlns="http://www.w3.org/2000/svg">
      <rect width="2540" height="254" fill="url(#dotsTan)"/>
      <use href="#blobs" fill="#E9531E" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>
      <use href="#leftTab"/>
      <use href="#qr" x="216" y="57"/>
      <image href="assets/logo_black.png" x="392" y="-6" width="860" height="267"/>
      <text x="1300" y="100" class="num" font-size="46" fill="#141414">with</text>
      <g fill="#fff" stroke="#141414" stroke-width="10" paint-order="stroke" stroke-linejoin="round">
        <text x="1292" y="224" class="bhs" font-size="132">쌍계사</text>
      </g>
      <g fill="#fff" stroke="#141414" stroke-width="9" paint-order="stroke" stroke-linejoin="round">
        <text x="1990" y="78" class="bhs" font-size="56">한옥 방사</text>
      </g>
      <g fill="#141414">
        <text x="1990" y="128" class="cond" font-size="44" transform="translate(1990 0) scale(.78 1) translate(-1990 0)">2026.11.06 – 11.08</text>
        <text x="1990" y="172" font-size="30">금 14:00 ~ 일 11:00</text>
        <text x="1990" y="226" class="num" font-size="34" letter-spacing="2">S-0001</text>
      </g>
      <use href="#rightTab"/>
      <rect x="0" y="0" width="2540" height="254" fill="none" stroke="#141414" stroke-width="10"/>
    </svg>
  </div>

  <!-- ============ D-3 : 당일 참가자 ============ -->
  <div class="item">
    <div class="label">D-3 · 당일 참가자 <small>하늘 메인 × 흰 구름 — 포스터 하늘·구름 색</small></div>
    <svg class="band" id="bandDay" viewBox="0 0 2540 254" xmlns="http://www.w3.org/2000/svg">
      <rect width="2540" height="254" fill="#fff"/>
      <use href="#blobs" fill="#52BFEA" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>
      <use href="#leftTab"/>
      <use href="#qr" x="216" y="57"/>
      <image href="assets/logo_black.png" x="392" y="-6" width="860" height="267"/>
      <text x="1300" y="100" class="num" font-size="46" fill="#141414">with</text>
      <g fill="#EEE639" stroke="#141414" stroke-width="10" paint-order="stroke" stroke-linejoin="round">
        <text x="1292" y="224" class="bhs" font-size="132">쌍계사</text>
      </g>
      <g fill="#fff" stroke="#141414" stroke-width="9" paint-order="stroke" stroke-linejoin="round">
        <text x="1990" y="78" class="bhs" font-size="56">당일 참가</text>
      </g>
      <g fill="#141414">
        <text x="1990" y="128" class="cond" font-size="44" transform="translate(1990 0) scale(.78 1) translate(-1990 0)">2026.11.06 – 11.08</text>
        <text x="1990" y="172" font-size="30">1DAY · 당일 1회 입장</text>
        <text x="1990" y="226" class="num" font-size="34" letter-spacing="2">D-0001</text>
      </g>
      <use href="#rightTab"/>
      <rect x="0" y="0" width="2540" height="254" fill="none" stroke="#141414" stroke-width="10"/>
    </svg>
  </div>
</div>
</body>
</html>
