<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>산사캠프 입장팔찌 시안</title>
<style>
  @font-face { font-family: "BHS"; src: url(assets/BlackHanSans-Regular.ttf); }
  @font-face { font-family: "Jua"; src: url(assets/Jua-Regular.ttf); }
  @font-face { font-family: "Rubik"; src: url(assets/Rubik.ttf); font-weight: 300 900; }
  body { margin: 0; background: #f2efe8; font-family: "Jua", sans-serif; color: #141414; }
  .sheet { padding: 48px 56px; width: 1524px; }
  h1 { font-family: "BHS"; font-size: 40px; margin: 0 0 4px; font-weight: 400; }
  .spec { font-size: 17px; color: #555; margin-bottom: 36px; }
  .item { margin-bottom: 44px; }
  .label { font-family: "BHS"; font-size: 26px; margin-bottom: 10px; }
  .label small { font-family: "Jua"; font-size: 17px; color: #555; margin-left: 10px; }
  svg.band { display: block; width: 1524px; height: 152.4px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.18)); }
  text { font-family: "Jua"; }
  .bhs { font-family: "BHS"; }
  .num { font-family: "Rubik"; font-weight: 800; }
</style>
</head>
<body>
<div class="sheet">
  <h1>2026 山寺캠프 with 쌍계사 · 입장팔찌 시안</h1>
  <div class="spec">타이벡 팔찌 254 × 25.4mm (10" × 1") · 오른쪽 40mm는 접착 탭 + 일련번호 · 점선은 접착부 가이드(인쇄 시 제외)</div>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <pattern id="dotsGreen" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="12" height="12" fill="#2EA85C"/>
        <circle cx="6" cy="6" r="2.6" fill="#1E7A41"/>
      </pattern>
      <pattern id="dotsOrange" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="12" height="12" fill="#E9531E"/>
        <circle cx="6" cy="6" r="2.4" fill="#C23E10"/>
      </pattern>
      <pattern id="dotsTan" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="12" height="12" fill="#DDB28A"/>
        <circle cx="6" cy="6" r="2" fill="#C99A6E"/>
      </pattern>
      <pattern id="tilesOrange" width="60" height="44" patternUnits="userSpaceOnUse">
        <circle cx="30" cy="22" r="16" fill="#E9531E" stroke="#141414" stroke-width="5"/>
      </pattern>
      <pattern id="tilesGreen" width="60" height="44" patternUnits="userSpaceOnUse">
        <circle cx="30" cy="22" r="16" fill="#2EA85C" stroke="#141414" stroke-width="5"/>
      </pattern>
      <path id="leaf" d="M0,-50 L10,-26 L26,-34 L21,-10 L46,-14 L32,6 L40,16 L10,12 L3,30 L3,50 L-3,50 L-3,30 L-10,12 L-40,16 L-32,6 L-46,-14 L-21,-10 L-26,-34 L-10,-26 Z"/>
      <g id="tent">
        <path d="M0,140 L96,0 L206,140 Z" fill="#fff" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>
        <path d="M96,0 L74,140 L128,140 Z" fill="#141414"/>
        <path d="M86,14 L30,128" stroke="#141414" stroke-width="4" stroke-dasharray="12 9" fill="none"/>
      </g>
      <g id="chair">
        <path d="M6,8 L46,0 L52,52 L12,58 Z" fill="#EEE639" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
        <path d="M10,60 L58,52 M14,58 L4,96 M50,52 L64,92 M22,58 L56,92" stroke="#7A4A2E" stroke-width="7" stroke-linecap="round" fill="none"/>
      </g>
      <g id="dog">
        <path d="M-60,22 C-66,-14 -30,-34 6,-30 C40,-28 60,-8 58,16 C58,26 50,30 40,30 L-50,30 C-56,30 -60,28 -60,22 Z" fill="#fff" stroke="#141414" stroke-width="5"/>
        <path d="M-30,-26 C-14,-30 -4,-16 -14,-4 C-24,4 -40,-6 -30,-26 Z" fill="#141414"/>
        <path d="M14,-6 C32,-14 48,0 40,18 C30,22 14,14 14,-6 Z" fill="#141414"/>
        <path d="M22,8 Q30,14 38,8" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        <path d="M-50,30 Q-40,22 -30,30 M-20,30 Q-10,22 0,30" stroke="#141414" stroke-width="4" fill="none"/>
      </g>
      <g id="pavilion">
        <rect x="18" y="30" width="12" height="70" fill="#fff" stroke="#141414" stroke-width="5"/>
        <rect x="90" y="30" width="12" height="70" fill="#fff" stroke="#141414" stroke-width="5"/>
        <path d="M-6,34 Q60,14 126,34 L118,16 Q60,0 2,16 Z" fill="#E9531E" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
        <path d="M14,6 Q60,-8 106,6 L98,-4 Q60,-14 22,-4 Z" fill="#E9531E" stroke="#141414" stroke-width="5" stroke-linejoin="round"/>
      </g>
      <g id="cloud">
        <g stroke="#141414" stroke-width="14">
          <circle cx="90" cy="150" r="90"/><circle cx="220" cy="80" r="95"/><circle cx="380" cy="70" r="100"/>
          <circle cx="560" cy="70" r="105"/><circle cx="740" cy="80" r="95"/><circle cx="880" cy="150" r="90"/>
          <circle cx="300" cy="210" r="80"/><circle cx="480" cy="215" r="85"/><circle cx="680" cy="210" r="80"/>
          <rect x="60" y="110" width="860" height="160"/><rect x="180" y="-10" width="590" height="80"/>
        </g>
        <g fill="#fff">
          <circle cx="90" cy="150" r="90"/><circle cx="220" cy="80" r="95"/><circle cx="380" cy="70" r="100"/>
          <circle cx="560" cy="70" r="105"/><circle cx="740" cy="80" r="95"/><circle cx="880" cy="150" r="90"/>
          <circle cx="300" cy="210" r="80"/><circle cx="480" cy="215" r="85"/><circle cx="680" cy="210" r="80"/>
          <rect x="60" y="110" width="860" height="160"/><rect x="180" y="-10" width="590" height="80"/>
        </g>
      </g>
    </defs>
  </svg>

  <!-- ===================== A안 : 하늘 & 구름 ===================== -->
  <div class="item">
    <div class="label">A안 · 하늘과 구름 <small>포스터 상단 구름 타이틀을 그대로 옮긴 메인 톤 — 포스터와 가장 닮은 안</small></div>
    <svg class="band" id="bandA" viewBox="0 0 2540 254" xmlns="http://www.w3.org/2000/svg">
      <rect width="2540" height="254" fill="#52BFEA"/>
      <circle cx="1060" cy="36" r="64" fill="#E9531E" stroke="#141414" stroke-width="7"/>
      <path d="M980,254 L1180,160 L1300,214 L1470,130 L1650,222 L1780,176 L1940,254 Z" fill="url(#dotsGreen)" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>
      <use href="#cloud"/>
      <text x="485" y="54" text-anchor="middle" font-size="26" fill="#141414">2026 산사에서 즐기는 마인드 디톡스</text>
      <image href="assets/logo_black.png" x="150" y="68" width="483" height="150"/>
      <text x="770" y="150" text-anchor="middle" class="num" font-size="34" fill="#141414">with</text>
      <text x="770" y="202" text-anchor="middle" class="bhs" font-size="46" fill="#141414">쌍계사</text>
      <g fill="#fff" stroke="#141414" stroke-width="9" paint-order="stroke" stroke-linejoin="round">
        <text x="1110" y="140" class="num" font-size="92">11.06 – 11.08</text>
      </g>
      <g fill="#fff" stroke="#141414" stroke-width="6" paint-order="stroke" stroke-linejoin="round">
        <text x="1114" y="192" class="num" font-size="30">2026 · FRI 14:00 → SUN 11:00</text>
      </g>
      <g fill="#fff" stroke="#141414" stroke-width="7" paint-order="stroke" stroke-linejoin="round">
        <text x="1790" y="112" class="bhs" font-size="52">하동</text>
        <text x="1790" y="170" class="bhs" font-size="52">쌍계사</text>
      </g>
      <use href="#leaf" transform="translate(2060,72) rotate(-18) scale(.75)" fill="#E9531E" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
      <use href="#leaf" transform="translate(2040,192) rotate(22) scale(.6)" fill="#EEE639" stroke="#141414" stroke-width="7" stroke-linejoin="round"/>
      <rect x="2140" y="0" width="400" height="254" fill="#fff"/>
      <line x1="2140" y1="0" x2="2140" y2="254" stroke="#141414" stroke-width="6" stroke-dasharray="14 10"/>
      <text x="2340" y="84" text-anchor="middle" class="bhs" font-size="40" fill="#141414">입장 팔찌</text>
      <text x="2340" y="122" text-anchor="middle" font-size="22" fill="#555">ADMISSION · 2박 3일</text>
      <text x="2340" y="196" text-anchor="middle" class="num" font-size="54" fill="#E9531E" letter-spacing="2">No.0001</text>
      <rect x="0" y="0" width="2540" height="254" fill="none" stroke="#141414" stroke-width="10"/>
    </svg>
  </div>

  <!-- ===================== B안 : 초록 들판 캠핑 ===================== -->
  <div class="item">
    <div class="label">B안 · 초록 들판 캠핑 <small>망점 잔디 + 텐트·의자·잠든 강아지 — 캠핑 무드 강조, 야외 시인성 최상</small></div>
    <svg class="band" id="bandB" viewBox="0 0 2540 254" xmlns="http://www.w3.org/2000/svg">
      <rect width="2540" height="254" fill="url(#dotsGreen)"/>
      <path d="M0,0 L2540,0 L2540,30 Q2400,46 2260,30 Q2120,14 1980,30 Q1840,46 1700,30 Q1560,14 1420,30 Q1280,46 1140,30 Q1000,14 860,30 Q720,46 580,30 Q440,14 300,30 Q160,46 0,30 Z" fill="#52BFEA" stroke="#141414" stroke-width="6"/>
      <rect x="36" y="60" width="640" height="166" rx="83" fill="#fff" stroke="#141414" stroke-width="8"/>
      <image href="assets/logo_black.png" x="84" y="76" width="420" height="130"/>
      <text x="590" y="126" text-anchor="middle" class="num" font-size="26" fill="#141414">with</text>
      <text x="590" y="174" text-anchor="middle" class="bhs" font-size="40" fill="#141414">쌍계사</text>
      <use href="#tent" transform="translate(712,96) scale(.92)"/>
      <use href="#chair" transform="translate(912,130) scale(.92)"/>
      <g fill="#fff" stroke="#141414" stroke-width="10" paint-order="stroke" stroke-linejoin="round">
        <text x="1020" y="132" class="num" font-size="74">2026.11.06 FRI</text>
        <text x="1020" y="218" class="num" font-size="74">– 11.08 SUN</text>
      </g>
      <g fill="#EEE639" stroke="#141414" stroke-width="8" paint-order="stroke" stroke-linejoin="round">
        <text x="1520" y="214" class="bhs" font-size="46">하동 쌍계사 일원</text>
      </g>
      <use href="#dog" transform="translate(1990,184) scale(1.15)"/>
      <use href="#leaf" transform="translate(1960,82) rotate(-20) scale(.6)" fill="#E9531E" stroke="#141414" stroke-width="8" stroke-linejoin="round"/>
      <use href="#leaf" transform="translate(2080,66) rotate(24) scale(.45)" fill="#EEE639" stroke="#141414" stroke-width="10" stroke-linejoin="round"/>
      <rect x="2140" y="0" width="400" height="254" fill="#EEE639"/>
      <line x1="2140" y1="0" x2="2140" y2="254" stroke="#141414" stroke-width="6" stroke-dasharray="14 10"/>
      <text x="2340" y="84" text-anchor="middle" class="bhs" font-size="40" fill="#141414">ADMIT ONE</text>
      <text x="2340" y="122" text-anchor="middle" font-size="24" fill="#141414">입장 · 재사용 불가</text>
      <text x="2340" y="196" text-anchor="middle" class="num" font-size="54" fill="#141414" letter-spacing="2">No.0001</text>
      <rect x="0" y="0" width="2540" height="254" fill="none" stroke="#141414" stroke-width="10"/>
    </svg>
  </div>

  <!-- ===================== C안 : 가을 산사 (구역별 컬러코드) ===================== -->
  <div class="item">
    <div class="label">C안 · 가을 산사 <small>기와 처마 + 단풍잎, 숙박 구역별 컬러코드 (캠핑존 / 한옥 방사 스테이) — 현장 운영형</small></div>
    <svg class="band" id="bandC1" viewBox="0 0 2540 254" xmlns="http://www.w3.org/2000/svg">
      <rect width="2540" height="254" fill="#FFFBEF"/>
      <rect x="0" y="14" width="2140" height="44" fill="url(#tilesOrange)"/>
      <rect x="0" y="0" width="2140" height="34" fill="#E9531E" stroke="#141414" stroke-width="6"/>
      <path d="M0,254 L0,222 Q300,204 640,222 T1300,220 T2140,222 L2140,254 Z" fill="url(#dotsTan)" stroke="#141414" stroke-width="6"/>
      <path d="M1180,254 Q1240,232 1340,236 T1560,232 L1580,254 Z" fill="#52BFEA" stroke="#141414" stroke-width="5"/>
      <image href="assets/logo_black.png" x="56" y="68" width="460" height="143"/>
      <text x="566" y="130" class="num" font-size="28" fill="#141414">with</text>
      <text x="566" y="180" class="bhs" font-size="44" fill="#141414">쌍계사</text>
      <use href="#pavilion" transform="translate(770,100) scale(1.05)"/>
      <text x="960" y="146" class="num" font-size="70" fill="#141414">11.06 – 11.08</text>
      <text x="964" y="192" font-size="28" fill="#141414">2026 · 금 14:00 ~ 일 11:00 · 하동 쌍계사 일원</text>
      <rect x="1640" y="72" width="260" height="124" rx="62" fill="url(#dotsGreen)" stroke="#141414" stroke-width="7"/>
      <text x="1770" y="120" text-anchor="middle" class="num" font-size="24" fill="#fff" letter-spacing="3">ZONE A</text>
      <g fill="#fff" stroke="#141414" stroke-width="6" paint-order="stroke"><text x="1770" y="172" text-anchor="middle" class="bhs" font-size="46">캠핑존</text></g>
      <use href="#leaf" transform="translate(1980,110) rotate(-16) scale(.8)" fill="#E9531E" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
      <use href="#leaf" transform="translate(2075,176) rotate(28) scale(.5)" fill="#EEE639" stroke="#141414" stroke-width="9" stroke-linejoin="round"/>
      <rect x="2140" y="0" width="400" height="254" fill="url(#dotsGreen)"/>
      <line x1="2140" y1="0" x2="2140" y2="254" stroke="#141414" stroke-width="6" stroke-dasharray="14 10"/>
      <g fill="#fff" stroke="#141414" stroke-width="6" paint-order="stroke">
        <text x="2340" y="86" text-anchor="middle" class="bhs" font-size="40">캠핑존 입장</text>
        <text x="2340" y="190" text-anchor="middle" class="num" font-size="56" letter-spacing="2">C-0001</text>
      </g>
      <rect x="0" y="0" width="2540" height="254" fill="none" stroke="#141414" stroke-width="10"/>
    </svg>
    <div style="height:18px"></div>
    <svg class="band" id="bandC2" viewBox="0 0 2540 254" xmlns="http://www.w3.org/2000/svg">
      <rect width="2540" height="254" fill="#FFFBEF"/>
      <rect x="0" y="14" width="2140" height="44" fill="url(#tilesGreen)"/>
      <rect x="0" y="0" width="2140" height="34" fill="#2EA85C" stroke="#141414" stroke-width="6"/>
      <path d="M0,254 L0,222 Q300,204 640,222 T1300,220 T2140,222 L2140,254 Z" fill="url(#dotsTan)" stroke="#141414" stroke-width="6"/>
      <path d="M1180,254 Q1240,232 1340,236 T1560,232 L1580,254 Z" fill="#52BFEA" stroke="#141414" stroke-width="5"/>
      <image href="assets/logo_black.png" x="56" y="68" width="460" height="143"/>
      <text x="566" y="130" class="num" font-size="28" fill="#141414">with</text>
      <text x="566" y="180" class="bhs" font-size="44" fill="#141414">쌍계사</text>
      <use href="#pavilion" transform="translate(770,100) scale(1.05)"/>
      <text x="960" y="146" class="num" font-size="70" fill="#141414">11.06 – 11.08</text>
      <text x="964" y="192" font-size="28" fill="#141414">2026 · 금 14:00 ~ 일 11:00 · 하동 쌍계사 일원</text>
      <rect x="1640" y="72" width="260" height="124" rx="62" fill="url(#dotsOrange)" stroke="#141414" stroke-width="7"/>
      <text x="1770" y="120" text-anchor="middle" class="num" font-size="24" fill="#fff" letter-spacing="3">ZONE B</text>
      <g fill="#fff" stroke="#141414" stroke-width="6" paint-order="stroke"><text x="1770" y="172" text-anchor="middle" class="bhs" font-size="42">한옥 방사</text></g>
      <use href="#leaf" transform="translate(1980,110) rotate(-16) scale(.8)" fill="#2EA85C" stroke="#141414" stroke-width="6" stroke-linejoin="round"/>
      <use href="#leaf" transform="translate(2075,176) rotate(28) scale(.5)" fill="#E9531E" stroke="#141414" stroke-width="9" stroke-linejoin="round"/>
      <rect x="2140" y="0" width="400" height="254" fill="url(#dotsOrange)"/>
      <line x1="2140" y1="0" x2="2140" y2="254" stroke="#141414" stroke-width="6" stroke-dasharray="14 10"/>
      <g fill="#fff" stroke="#141414" stroke-width="6" paint-order="stroke">
        <text x="2340" y="86" text-anchor="middle" class="bhs" font-size="38">한옥스테이 입장</text>
        <text x="2340" y="190" text-anchor="middle" class="num" font-size="56" letter-spacing="2">H-0001</text>
      </g>
      <rect x="0" y="0" width="2540" height="254" fill="none" stroke="#141414" stroke-width="10"/>
    </svg>
  </div>
</div>
</body>
</html>
